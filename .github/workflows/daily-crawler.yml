name: Daily Tiangong Classroom Data Crawler & Deploy

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00（每日清晨更新当天数据）
    # 2026-09-16 从 22:00 UTC 提前 2 小时：实测 GitHub 定时任务会延迟 1.5–2 小时才真正跑起来，
    # 名义 06:00 实际落库 07:42–08:02，于是每天 06:00–08:00 站点一直挂着「非实时」横幅。
    # 提前到 04:00 是对冲这份延迟，目标把实际落库拉回 05:45–06:00。
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: crawler-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    # 抓取本身只要 6 秒。留 3 小时是因为：04:00 若发现教务系统还没翻篇，
    # 脚本会每 30 分钟复查一次、最多 4 次（见 fetch_rooms.ensure_server_day_rolled）。
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 当前任务发布当天数据，重跑时也从 main 的最新状态开始。
          ref: main
          fetch-depth: 0

      - name: Sync Main Before Generating Data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 在抓取产生改动之前同步，避免恢复 autostash 时两份 today.json 冲突。
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f crawler/requirements.txt ]; then pip install -r crawler/requirements.txt; fi

      - name: Run Bitmask Unit Tests
        run: |
          python crawler/test_bitmask.py

      - name: Run Real Crawler & Parser Script
        env:
          TIANGONG_USERNAME: ${{ secrets.TIANGONG_USERNAME }}
          TIANGONG_PASSWORD: ${{ secrets.TIANGONG_PASSWORD }}
          TZ: Asia/Shanghai
        run: |
          python crawler/fetch_rooms.py

      # 抓取脚本退出码 0 只说明它没崩，不说明产物可信。
      # 这一关在提交之前把"结构不对 / 日期不对 / 两份不一致 / source 不是 live"全部拦住。
      - name: Verify Crawled Data
        run: |
          python crawler/verify_data.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update today.json schedule data [skip ci]"
          file_pattern: "public/data/today.json web/data/today.json"
          skip_dirty_check: true
          branch: main
          # 提交已校验的产物，不再在抓取之后切换或同步基线。
          skip_fetch: true
          skip_checkout: true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
