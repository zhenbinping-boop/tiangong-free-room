name: Daily Tiangong Classroom Data Crawler & Deploy

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00（每日清晨更新当天数据；原 19:00 UTC 对应北京凌晨 3 点且因 UTC 时区取错"天"）
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: crawler-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f crawler/requirements.txt ]; then pip install -r crawler/requirements.txt; fi

      - name: Run Bitmask Unit Tests
        run: |
          python crawler/test_bitmask.py

      - name: Run Real Crawler & Parser Script
        env:
          TIANGONG_USERNAME: ${{ secrets.TIANGONG_USERNAME }}
          TIANGONG_PASSWORD: ${{ secrets.TIANGONG_PASSWORD }}
          TZ: Asia/Shanghai
        run: |
          python crawler/fetch_rooms.py

      # 抓取脚本退出码 0 只说明它没崩，不说明产物可信。
      # 这一关在提交之前把"结构不对 / 日期不对 / 两份不一致 / source 不是 live"全部拦住。
      - name: Verify Crawled Data
        run: |
          python crawler/verify_data.py

      - name: Fetch and Sync Latest Remote Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 不加 `|| true`：pull 失败必须让流水线红，而不是带着可能过期的基线继续 push。
          # --autostash 必须带着：跑到这一步时工作区里是刚抓取、刚过门禁的 today.json（有意
          # 未提交），rebase 会因未暂存改动拒绝执行（exit 128），首跑已实际触发。
          # autostash 临时收起这些改动、rebase 后弹回；弹回若冲突仍会失败，严格性不丢。
          git pull --rebase --autostash origin main

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update today.json schedule data [skip ci]"
          file_pattern: "public/data/today.json web/data/today.json"
          skip_dirty_check: true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
