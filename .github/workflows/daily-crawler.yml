name: Daily Tiangong Classroom Data Crawler & Deploy

on:
  schedule:
    # Trigger daily at 19:00 UTC (03:00 AM Beijing Time)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f crawler/requirements.txt ]; then pip install -r crawler/requirements.txt; fi

      - name: Run Bitmask Unit Tests
        run: |
          python crawler/test_bitmask.py

      - name: Run Real Crawler & Parser Script
        env:
          TIANGONG_USERNAME: ${{ secrets.TIANGONG_USERNAME }}
          TIANGONG_PASSWORD: ${{ secrets.TIANGONG_PASSWORD }}
          TIANGONG_COOKIE: ${{ secrets.TIANGONG_COOKIE }}
        run: |
          python crawler/fetch_rooms.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update today.json schedule data [skip ci]"
          file_pattern: "public/data/today.json web/data/today.json"
          skip_dirty_check: true
          push_options: '--force'

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
