name: Daily Tiangong Classroom Data Crawler & Deploy

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00（每日清晨更新当天数据；原 19:00 UTC 对应北京凌晨 3 点且因 UTC 时区取错"天"）
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: crawler-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f crawler/requirements.txt ]; then pip install -r crawler/requirements.txt; fi

      - name: Run Bitmask Unit Tests
        run: |
          python crawler/test_bitmask.py

      - name: Run Real Crawler & Parser Script
        env:
          TIANGONG_USERNAME: ${{ secrets.TIANGONG_USERNAME }}
          TIANGONG_PASSWORD: ${{ secrets.TIANGONG_PASSWORD }}
          TZ: Asia/Shanghai
        run: |
          python crawler/fetch_rooms.py

      - name: Fetch and Sync Latest Remote Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update today.json schedule data [skip ci]"
          file_pattern: "public/data/today.json web/data/today.json"
          skip_dirty_check: true
          push_options: '--force-with-lease'

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
