<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>天工大空教室 · 按楼栋楼层查</title>

  <meta name="description" content="天津工业大学空教室查询：按楼栋、楼层查看第一与第二公共教学楼的空闲教室，数据每日自动抓取自教务系统。">
  <meta name="theme-color" content="#0369a1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="天工空教室">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-container">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9.5 19.5v-5h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <h1 class="brand-title">天工大空教室</h1>
    </div>
    <button id="themeToggleBtn" class="btn-icon" aria-label="切换深色或浅色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="main-content">

  <div id="statusBar" class="status-bar" role="status">
    <span id="statusDot" class="status-dot" data-state="loading"></span>
    <span id="statusText" class="status-text">正在读取教室数据…</span>
  </div>

  <div id="staleBanner" class="banner" role="alert" hidden>
    <strong>当前数据非实时</strong>
    <span id="staleDetail">今日自动抓取尚未成功，以下为最近一次成功获取的结果。</span>
  </div>

  <div id="pwaInstallBanner" class="banner banner-quiet" hidden>
    <span>添加到主屏幕，免浏览器地址栏</span>
    <button id="installPwaBtn" class="btn-quiet">添加</button>
  </div>

  <section class="panel" aria-labelledby="slotHeading">
    <h2 id="slotHeading" class="panel-title">目标节次</h2>
    <div id="slotGrid" class="slot-grid" role="group" aria-label="选择节次"></div>
    <label class="toggle">
      <input type="checkbox" id="allDayCheckbox">
      <span>只看全天无课的教室</span>
    </label>
  </section>

  <div class="controls">
    <div class="search-box">
      <input type="search" id="searchInput" class="search-input" placeholder="搜房号或楼层，如 C419 或 3" aria-label="搜索教室">
    </div>
    <select id="sortSelect" class="select" aria-label="排序方式">
      <option value="room_asc">按房号</option>
      <option value="cap_desc">按容量</option>
      <option value="free_slots">按连空节数</option>
    </select>
  </div>

  <div id="capChips" class="chip-row" role="group" aria-label="按容量筛选">
    <button class="chip is-active" data-cap="all">不限</button>
    <button class="chip" data-cap="s">小 &lt;80</button>
    <button class="chip" data-cap="m">中 80–149</button>
    <button class="chip" data-cap="l">大 ≥150</button>
  </div>

  <div id="skeleton" class="skeleton" aria-hidden="true">
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
  </div>

  <div id="buildingGroups" class="building-groups" aria-live="polite"></div>

  <div id="emptyState" class="notice" hidden>
    <p class="notice-title">没有符合条件的教室</p>
    <p class="notice-desc">试着放宽节次或容量条件。</p>
  </div>

  <div id="errorState" class="notice" hidden>
    <p class="notice-title">无法加载数据</p>
    <p class="notice-desc">网络不可用，或 data/today.json 缺失。此处不会显示任何推测数据。</p>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
