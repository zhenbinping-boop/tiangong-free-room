<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>天工大极简空教室 - 秒级直达</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="免登录、零广告、秒级直达的天津工业大学空教室极简查询工具，支持PWA离线浏览与多节次位运算过滤">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="天工空教室">
  
  <!-- Manifest & Styles -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header / Navigation -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-logo">
        <div class="brand-icon">工</div>
        <div>
          <h1 class="brand-title">天工空教室</h1>
          <p class="brand-subtitle">极简 · 秒级 · JAMstack</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="btn-icon" title="切换主题" aria-label="切换深色/浅色模式">🌙</button>
      </div>
    </div>
  </header>

  <!-- Main Application Body -->
  <main class="main-content">

    <!-- PWA Installation Banner (Hidden by default) -->
    <div id="pwaInstallBanner" class="pwa-banner" style="display: none;">
      <div class="pwa-text">💡 添加到主屏幕，体验免浏览器 App 级全屏极速查询</div>
      <button id="installPwaBtn" class="btn-pwa">添加桌面</button>
    </div>

    <!-- Time Detection & Recommendation Card -->
    <div class="time-status-card">
      <div class="time-info-group">
        <span id="liveClock" class="live-clock-badge">08:00</span>
        <div id="recommendedSlotText" class="recommend-text">
          读取时间中...
        </div>
      </div>
    </div>

    <!-- Building Capsule Tabs (Horizontal Scrollable) -->
    <nav class="building-tabs-wrapper" aria-label="教学楼选择">
      <div id="buildingTabs" class="building-tabs">
        <!-- Dynamically rendered by app.js -->
      </div>
    </nav>

    <!-- Time Slot Selector Matrix -->
    <section class="slot-section">
      <div class="section-header">
        <h2 class="section-title">
          <span>🕒 目标节次</span>
        </h2>
        <label class="all-day-toggle">
          <input type="checkbox" id="allDayCheckbox">
          <span>全天无课</span>
        </label>
      </div>
      <div id="slotGrid" class="slot-grid">
        <!-- Dynamically rendered by app.js -->
      </div>
    </section>

    <!-- Search & Sort Controls Bar -->
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索房号/教学楼/多媒体 (如 301, A101)...">
      </div>
      <select id="sortSelect" class="sort-select" aria-label="排序规则">
        <option value="room_asc">房号升序</option>
        <option value="cap_desc">容量从大到小</option>
        <option value="free_slots">空闲节数最多</option>
      </select>
    </div>

    <!-- Results Count Bar -->
    <div class="results-summary">
      <div>共为您找到 <span id="resultsCount" class="results-count">0</span> 间空教室</div>
      <div id="updatedAtText">加载中...</div>
    </div>

    <!-- Classroom Card Grid -->
    <section id="classroomList" class="classroom-list" aria-live="polite">
      <!-- Classroom Cards rendered by app.js -->
    </section>

    <!-- Empty Filter State -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">🍵</div>
      <div class="empty-title">当前筛选条件无空教室</div>
      <div class="empty-desc">尝试取消部分节次选择或切换至其他教学楼</div>
    </div>

  </main>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
